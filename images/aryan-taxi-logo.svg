<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mtnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Taxi Yellow Gradient -->
    <linearGradient id="taxiYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4.5"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Sahyadri Mountain Peaks -->
  <polygon points="26,126 58,82 92,126" fill="#0284c7" opacity="0.5"/>
  <polygon points="76,126 116,70 156,126" fill="#0369a1" opacity="0.6"/>
  <polygon points="44,126 80,88 116,126" fill="url(#mtnGrad)" opacity="0.85"/>
  <polygon points="102,126 138,80 174,126" fill="url(#mtnGrad)" opacity="0.9"/>

  <!-- Morning Sunrise Sun Glow -->
  <circle cx="100" cy="80" r="13" fill="#fbbf24" opacity="0.8"/>

  <!-- Road Plateau Baseline -->
  <path d="M22,126 Q100,122 178,126 L178,146 Q100,142 22,146 Z" fill="#0f172a"/>
  <path d="M60,136 L76,136 M94,136 L110,136 M128,136 L144,136" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Iconic Black & Yellow Taxi Cab -->
  <g transform="translate(56, 102)">
    <!-- Cab Body (Yellow Base) -->
    <rect x="8" y="16" width="72" height="14" rx="4" fill="url(#taxiYellow)"/>
    
    <!-- Cab Cabin (Classic Black Top) -->
    <path d="M18,16 L27,5 L61,5 L70,16 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <!-- Windows -->
    <path d="M22,14 L29,7 L42,7 L42,14 Z" fill="#e0f2fe"/>
    <path d="M46,7 L59,7 L66,14 L46,14 Z" fill="#e0f2fe"/>

    <!-- TAXI Roof Sign -->
    <rect x="37" y="1" width="14" height="4.5" rx="1.2" fill="#f59e0b"/>
    <text x="44" y="4.2" font-size="2.8" font-family="Arial, sans-serif" font-weight="900" fill="#0f172a" text-anchor="middle">TAXI</text>

    <!-- Wheels -->
    <circle cx="23" cy="29" r="6.8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="23" cy="29" r="3" fill="#64748b"/>
    <circle cx="65" cy="29" r="6.8" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="65" cy="29" r="3" fill="#64748b"/>

    <!-- Headlight & Taillight -->
    <rect x="78" y="18" width="3" height="4.5" rx="1" fill="#fef08a"/>
    <rect x="7" y="18" width="2.5" height="3.5" rx="1" fill="#ef4444"/>
  </g>

  <!-- Typography Arc: ARYAN TAXI -->
  <text x="100" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    ARYAN TAXI
  </text>
  
  <!-- Subtitle: MAHABALESHWAR -->
  <text x="100" y="56" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
    MAHABALESHWAR
  </text>

  <!-- Bottom Tagline Ribbon -->
  <rect x="35" y="160" width="130" height="18" rx="9" fill="#0891b2" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="172.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    EXPLORE SAHYADRI
  </text>

  <!-- Star Accents -->
  <polygon points="100,61 101.5,65 106,65.5 102.5,68.5 103.5,73 100,70.5 96.5,73 97.5,68.5 94,65.5 98.5,65" fill="#fbbf24"/>
</svg>